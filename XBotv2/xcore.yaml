# XBotv2 默认插件树与统一配置（cordis.yaml 风格，bundled——类似 DeepSeek
# Harness 的 cordis.patch.yml）。这是**唯一配置文档**：插件树 + 每插件配置
# （权限/沙箱/任务限制/钩子/工具/agent 指令）。行序无语义（activation is
# service-availability driven）：每个插件声明 inject 依赖，XCore 在所需服务
# 可用时自动激活。
#
# `${env:VAR}` 由插件树解析器读取环境变量；`${workspace}` 等运行时变量
# 保持字面量并由对应配置消费者展开。Agent 选择、model override、父子关系等
# launch facts 由 application 直接持有，不进入插件配置。
# 用户全局覆盖：<data-dir>/config/plugins.yaml；工作区覆盖：
# .xbot/plugins.yaml；session/调用级覆盖最后应用。覆盖已有条目时仅需 id，
# 省略字段保持原值；新增插件必须同时提供 id 和 name。

- id: config
  name: config
  config:
    user:
      user_id: default-user
      user_name: User
      platform: terminal
      session_type: interactive

- id: persistence
  name: persistence

- id: usage
  name: usage

- id: agent-catalog
  name: agents.catalog_provider

- id: session
  name: session

- id: jobs
  name: jobs
  config:
    max_concurrent_subagents: 4

- id: commands
  name: commands

- id: llm
  name: llm
  profiles: [agent, server]
  config:
    default: minimax
    providers:
      minimax:
        protocol: anthropic
        base_url: https://api.minimaxi.com/anthropic
        api_key_env: MINIMAX_API_TOKEN
        default_model: Minimax-M3
        models:
          - model: Minimax-M3
            temperature: 0.2
            max_context_tokens: 1000000
            max_output_tokens: 32768
            # MiniMax-M3: temperature range [0, 2]; thinking modes are
            # "adaptive" / "disabled" (adapter-owned, serialized to
            # extra_body.thinking). MiniMax has no reasoning_effort.
            thinking: adaptive
            input_modalities:
              - text
              - image
          - model: Minimax-M2.7
            temperature: 0.2
            max_context_tokens: 204800
            max_output_tokens: 32768
            thinking: adaptive
            input_modalities:
              - text
      deepseek:
        protocol: openai
        base_url: https://api.deepseek.com/v1
        api_key_env: DEEPSEEK_API_KEY
        default_model: deepseek-v4-flash
        models:
          - model: deepseek-v4-flash
            temperature: 0.7
            max_context_tokens: 1048576
            reasoning_effort: high
            # Official DeepSeek thinking-mode effort values: low/high/max.
            effort: [low, high, max]
            thinking: enabled
            input_modalities:
              - text
          - model: deepseek-v4-pro
            temperature: 0.7
            max_context_tokens: 1048576
            reasoning_effort: high
            # Official DeepSeek thinking-mode effort values: low/high/max.
            effort: [low, high, max]
            thinking: enabled
            input_modalities:
              - text
      openai:
        protocol: openai
        base_url: https://api.openai.com/v1
        api_key_env: OPENAI_API_KEY
        default_model: gpt-5.6-luna
        models:
          # Official GPT-5.6 family effort values: none/low/medium/high/
          # xhigh/max; default is medium when omitted.  Context 1,050,000,
          # max output 128,000 (official model pages).
          - model: gpt-5.6-luna
            temperature: 0.7
            max_context_tokens: 1050000
            max_output_tokens: 128000
            reasoning_effort: high
            effort: [none, low, medium, high, xhigh, max]
          - model: gpt-5.6-sol
            temperature: 0.7
            max_context_tokens: 1050000
            max_output_tokens: 128000
            reasoning_effort: high
            effort: [none, low, medium, high, xhigh, max]
      anthropic:
        protocol: anthropic
        base_url: https://api.anthropic.com
        api_key_env: ANTHROPIC_API_KEY
        default_model: claude-sonnet-4-20250514
        models:
          - model: claude-sonnet-4-20250514
            temperature: 0.7
            max_context_tokens: 200000
            max_output_tokens: 64000
      lmstudio:
        protocol: openai
        base_url: http://localhost:1234/v1
        api_key: lm-studio
        default_model: qwen/qwen3-1.7b
        models:
          - model: qwen/qwen3-1.7b
            temperature: 0.2
            max_context_tokens: 32768
            reasoning_effort: high
            thinking: enabled

- id: tools
  name: agentloop.tools

- id: agentloop
  name: agentloop.runtime

- id: agent-runtime
  name: agents.runtime

- id: llm-commands
  name: llm.runtime_commands
  profiles: [agent]

- id: context_builder
  name: context_builder

- id: prompts
  name: prompts

- id: sandbox
  name: sandbox
  config:
    sandbox:
      enabled: true
      network: true
      external_read: readonly
      external_write: deny
      workspace_read: allow
      workspace_write: allow
    resources: []

- id: permission_request
  name: permission_request

- id: permissions
  name: permissions
  config:
    permissions:
      allow:
        - tool: (?:create_goal|get_goal|update_goal)
        - tool: compact
        - tool: (?:list_shells|wait_shell|read_shell|cancel_shell)
        - tool: (?:spawn_subagent|list_subagents|wait_subagent|read_subagent|cancel_subagent)
        - tool: (?:send_message|ask_user|request_permission)
        - tool: search
        - tool: (?:web_search|web_fetch|browser_open|browser_snapshot|browser_screenshot|browser_close)
        - tool: update_todos
        - tool: read
        - tool: edit
          paths: ${workspace}
        - tool: path
          paths: ${workspace}
        - tool: shell
      ask:
        - tool: (?:browser_click|browser_fill|browser_press|browser_select)
        - tool: edit
        - tool: path
        - tool: shell
          params:
            sandbox_permissions: require_escalated
      deny:
        - tool: .*
          params:
            command: rm -rf /.*

- id: coretools
  name: coretools
  config:
    tool_results:
      max_inline_chars: 12000
      preview_chars: 4000
    hooks: []
    tools: null
    workspace_tools: []

- id: subagents
  name: agents.subagent_tools

- id: goal
  name: goal

- id: todolist
  name: todolist

