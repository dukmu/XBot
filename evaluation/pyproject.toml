[project]
name = "xbot-eval-harness"
version = "0.1.0"
description = "Inspect AI adapter and evaluation tasks for XBot"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.11.1,<0.12",
    "anthropic>=0.96,<1",
    "inspect-ai>=0.3.249,<0.4",
    "pytest>=8,<10",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
