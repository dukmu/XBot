# Evaluation bridge plugin-tree overlay.
# Provider definitions live in the llm plugin's tree config (the bundled
# xcore.yaml provides the base providers); this overlay pins the default and
# the bridge "inspect" provider is added at runtime by the adapter.
- id: llm
  name: llm
  config:
    default: minimax
    providers:
      minimax:
        protocol: anthropic
        base_url: https://api.minimaxi.com/anthropic
        api_key_env: MINIMAX_API_TOKEN
        default_model: Minimax-M3
        models:
          - model: Minimax-M3
            temperature: 0.2
            max_context_tokens: 1000000
            max_output_tokens: 32768
            # MiniMax-M3: temperature [0, 2]; thinking modes are
            # "adaptive" / "disabled"; no reasoning_effort.
            thinking: adaptive
            input_modalities:
              - text
              - image
          - model: Minimax-M2.7
            temperature: 0.2
            max_context_tokens: 204800
            max_output_tokens: 32768
            thinking: adaptive
            input_modalities:
              - text
      deepseek:
        protocol: openai
        base_url: https://api.deepseek.com/v1
        api_key_env: DEEPSEEK_API_KEY
        default_model: deepseek-v4-flash
        models:
          - model: deepseek-v4-flash
            temperature: 0.7
            max_context_tokens: 1048576
            reasoning_effort: high
            # Official DeepSeek thinking-mode effort values: low/high/max.
            effort: [low, high, max]
            thinking: enabled
            input_modalities:
              - text
          - model: deepseek-v4-pro
            temperature: 0.7
            max_context_tokens: 1048576
            reasoning_effort: high
            # Official DeepSeek thinking-mode effort values: low/high/max.
            effort: [low, high, max]
            thinking: enabled
            input_modalities:
              - text

- id: config
  name: config
  config:
    user:
      user_id: default-user
      user_name: User
      platform: terminal
      session_type: interactive
