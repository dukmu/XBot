[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xcore"
version = "0.1.0"
description = "Python Cordis-like plugin-centric runtime core: recoverable state, plugins, events, lifecycle, services"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["xcore*"]
